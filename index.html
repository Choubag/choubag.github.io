<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChouBag</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;

      background: #e8d6b8;
    }

    .card {
      width: 100%;
      max-width: 420px;

      min-height: 650px;

      position: relative;

      padding: 45px 30px 30px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          #fffaf1,
          #f4e7d0
        );

      border: 1px solid rgba(35, 30, 20, 0.15);

      border-radius: 28px;

      box-shadow:
        0 25px 60px rgba(45, 35, 20, 0.25);

      overflow: hidden;
    }

    /* Elegant border */

    .card::before {
      content: "";

      position: absolute;

      top: 14px;
      left: 14px;
      right: 14px;
      bottom: 14px;

      border: 1px solid rgba(30, 25, 18, 0.18);

      border-radius: 20px;

      pointer-events: none;
    }

    /* Decorative top */

    .ornament {
      font-family: Georgia, serif;

      font-size: 22px;

      color: #171717;

      letter-spacing: 8px;

      margin-bottom: 25px;
    }

    /* Logo */

    .logo {
      width: 115px;
      height: 115px;

      margin: 0 auto 25px;

      border-radius: 50%;

      background: #171717;

      color: #e8d6b8;

      border: 6px solid #e8d6b8;

      outline: 1px solid #171717;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Georgia, serif;

      font-size: 30px;

      font-weight: bold;

      letter-spacing: 4px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.18);
    }

    /* Brand */

    h1 {
      font-family: Georgia, "Times New Roman", serif;

      font-size: 43px;

      font-weight: 600;

      letter-spacing: 3px;

      color: #171717;

      margin-bottom: 12px;
    }

    /* Subtitle */

    .subtitle {
      font-family: Georgia, serif;

      font-size: 16px;

      color: #6e6456;

      letter-spacing: 0.5px;

      margin-bottom: 25px;
    }

    /* Divider */

    .divider {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      margin: 0 auto 30px;

      width: 150px;
    }

    .divider span {
      height: 1px;

      flex: 1;

      background: #171717;
    }

    .divider i {
      width: 7px;
      height: 7px;

      transform: rotate(45deg);

      background: #171717;
    }

    /* Buttons */

    .social-button {
      width: 100%;

      height: 60px;

      margin-bottom: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      border-radius: 14px;

      text-decoration: none;

      font-size: 16px;

      font-weight: bold;

      letter-spacing: 0.3px;

      transition: 0.25s ease;
    }

    .social-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 10px 25px rgba(0,0,0,0.15);
    }

    /* Facebook */

    .facebook {
      background: #1877f2;

      color: white;
    }

    /* Instagram */

    .instagram {
      background: #171717;

      color: white;
    }

    .icon {
      font-size: 22px;

      font-weight: bold;
    }

    /* Footer */

    .footer {
      position: absolute;

      left: 0;
      right: 0;

      bottom: 30px;

      font-family: Georgia, serif;

      font-size: 11px;

      letter-spacing: 2px;

      color: #817664;
    }

    @media (max-width: 380px) {

      .card {
        min-height: 600px;

        padding: 40px 23px 25px;
      }

      h1 {
        font-size: 36px;
      }

      .logo {
        width: 95px;
        height: 95px;
      }
    }

  </style>
</head>

<body>

  <main class="card">

    <div class="ornament">
      CHOUBAG
    </div>

    <!-- Temporary logo -->
    <div class="logo">
      CB
    </div>

    <h1>ChouBag</h1>

    <p class="subtitle">
      Follow us on Facebook &amp; Instagram
    </p>

    <div class="divider">
      <span></span>
      <i></i>
      <span></span>
    </div>

    <a
      class="social-button facebook"
      href="https://www.facebook.com/Elchouvaliz"
      target="_blank"
      rel="noopener noreferrer">

      <span class="icon">f</span>

      <span>Follow us on Facebook</span>

    </a>

    <a
      class="social-button instagram"
      href="https://www.instagram.com/choubag_2026"
      target="_blank"
      rel="noopener noreferrer">

      <span class="icon">◎</span>

      <span>Follow us on Instagram</span>

    </a>

    <div class="footer">
      FASHION • BAGS • STYLE
    </div>

  </main>

</body>
</html>
