<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChouBag</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(circle at top left,
        rgba(255,255,255,0.8),
        transparent 35%),
        linear-gradient(135deg, #e6d1ad, #f8f1e5);
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: rgba(255, 252, 246, 0.97);

      border-radius: 30px;

      padding: 45px 28px 30px;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(50, 40, 25, 0.20);

      position: relative;
      overflow: hidden;
    }

    /* Top elegant line */
    .card::before {
      content: "";
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 6px;

      background: #171717;
    }

    /* Logo */
    .logo {
      width: 105px;
      height: 105px;

      margin: 0 auto 22px;

      border-radius: 50%;

      background: #171717;

      color: #e6d1ad;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Georgia, serif;

      font-size: 28px;
      font-weight: bold;

      letter-spacing: 3px;

      border: 5px solid #e6d1ad;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.18);
    }

    /* Brand name */
    h1 {
      font-family: Georgia, "Times New Roman", serif;

      font-size: 40px;

      letter-spacing: 2px;

      color: #171717;

      margin-bottom: 12px;
    }

    /* Subtitle */
    .subtitle {
      font-size: 16px;

      color: #777;

      letter-spacing: 0.3px;

      margin-bottom: 28px;
    }

    /* Decorative line */
    .line {
      width: 55px;
      height: 2px;

      background: #171717;

      margin: 0 auto 30px;
    }

    /* Social buttons */
    .social-button {
      width: 100%;

      min-height: 60px;

      margin-bottom: 16px;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      text-decoration: none;

      font-size: 17px;

      font-weight: bold;

      transition: all 0.25s ease;
    }

    .social-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 10px 22px rgba(0,0,0,0.15);
    }

    /* Facebook */
    .facebook {
      background: #1877f2;
      color: white;
    }

    /* Instagram */
    .instagram {
      background: #171717;
      color: white;
    }

    /* Icons */
    .icon {
      font-size: 22px;
      font-weight: bold;
    }

    /* Footer */
    .footer {
      margin-top: 28px;

      font-size: 12px;

      color: #999;

      letter-spacing: 1px;
    }

    @media (max-width: 380px) {

      .card {
        padding: 38px 20px 25px;
      }

      h1 {
        font-size: 34px;
      }

      .logo {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- ChouBag Logo -->
    <div class="logo">
      CB
    </div>

    <!-- Brand -->
    <h1>ChouBag</h1>

    <!-- Main message -->
    <p class="subtitle">
      Follow us on Facebook &amp; Instagram
    </p>

    <div class="line"></div>

    <!-- Facebook -->
    <a
      class="social-button facebook"
      href="https://www.facebook.com/Elchouvaliz"
      target="_blank"
      rel="noopener noreferrer">

      <span class="icon">f</span>
      <span>Follow us on Facebook</span>

    </a>

    <!-- Instagram -->
    <a
      class="social-button instagram"
      href="https://www.instagram.com/choubag_2026"
      target="_blank"
      rel="noopener noreferrer">

      <span class="icon">◎</span>
      <span>Follow us on Instagram</span>

    </a>

    <!-- Footer -->
    <div class="footer">
      CHOUBAG • FASHION • STYLE
    </div>

  </main>

</body>
</html>
