<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChouBag | Nos réseaux</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #fff8eb 0%, transparent 35%),
        linear-gradient(135deg, #e8d3b0, #f8f0e2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      color: #171717;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 252, 246, 0.96);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 30px;
      padding: 42px 28px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(60, 45, 25, 0.18);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 7px;
      background: #171717;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #171717;
      color: #e8d3b0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 38px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .line {
      width: 55px;
      height: 2px;
      background: #171717;
      margin: 0 auto 30px;
    }

    .social-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      margin-bottom: 15px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: all 0.25s ease;
    }

    .social-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.12);
    }

    .facebook {
      background: #1877f2;
      color: white;
    }

    .instagram {
      background: #171717;
      color: white;
    }

    .icon {
      font-size: 21px;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #999;
      letter-spacing: 0.5px;
    }

    @media (max-width: 380px) {
      .card {
        padding: 35px 20px 25px;
      }

      h1 {
        font-size: 33px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      CB
    </div>

    <h1>ChouBag</h1>

    <p class="subtitle">
      Retrouvez-nous sur nos réseaux sociaux
    </p>

    <div class="line"></div>

    <a
      class="social-button facebook"
      href="https://www.facebook.com/Elchouvaliz"
      target="_blank"
      rel="noopener noreferrer">

      <span class="icon">f</span>
      <span>Facebook</span>

    </a>

    <a
      class="social-button instagram"
      href="https://www.instagram.com/choubag_2026"
      target="_blank"
      rel="noopener noreferrer">

      <span class="icon">◎</span>
      <span>Instagram</span>

    </a>

    <div class="footer">
      CHOUBAG • Votre style, votre choix
    </div>

  </main>

</body>
</html>
