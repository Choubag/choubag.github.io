<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chou Bag</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3eadf;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
            font-size: 32px;
        }

        p {
            color: #777;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 16px;
            margin: 15px 0;
            border-radius: 12px;
            font-size: 18px;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.02);
            background: #444;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Chou Bag</h1>

        <p>تابعونا على مواقع التواصل الاجتماعي</p>

        <a class="button"
           href="https://www.facebook.com/Elchouvaliz"
           target="_blank">
            Facebook
        </a>

        <a class="button"
           href="https://www.instagram.com/choubag_2026"
           target="_blank">
            Instagram
        </a>

        <div class="footer">
            Chou Bag
        </div>

    </div>

</body>
</html>
